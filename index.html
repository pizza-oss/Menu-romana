<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pizzería La Romana — Menú Digital</title>
  <style>
    :root {
      --bg: #120d0a;
      --card: #1e1611;
      --card-2: #281d16;
      --text: #fff7ed;
      --muted: #cbb8a6;
      --accent: #e03c28;
      --accent-hover: #c52f1d;
      --gold: #f5b942;
      --whatsapp: #25d366;
      --border: rgba(255, 247, 237, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 110px;
      line-height: 1.45;
    }

    header {
      background: linear-gradient(180deg, #2b150e 0%, var(--bg) 100%);
      padding: 28px 18px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .badge {
      display: inline-block;
      background: rgba(245, 185, 66, 0.16);
      color: var(--gold);
      border: 1px solid rgba(245, 185, 66, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 18px 16px;
    }

    .section-title {
      font-size: 19px;
      font-weight: 800;
      margin: 22px 0 12px;
      color: var(--gold);
    }

    .pizza-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .pizza-name {
      font-size: 18px;
      font-weight: 700;
    }

    .pizza-desc {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
      margin-bottom: 12px;
    }

    .sizes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .size-btn {
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 6px;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      transition: 0.15s ease;
    }

    .size-btn strong {
      display: block;
      font-size: 13px;
    }

    .size-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    .crust-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .crust-toggle input {
      width: 18px;
      height: 18px;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .add-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-btn:hover {
      background: var(--accent-hover);
    }

    .form-box,
    .cart-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-top: 10px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-top: 12px;
      margin-bottom: 5px;
      color: var(--muted);
    }

    label:first-child {
      margin-top: 0;
    }

    select,
    input,
    textarea {
      width: 100%;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .cart-item:last-of-type {
      border-bottom: none;
    }

    .remove-btn {
      background: rgba(224, 60, 40, 0.18);
      color: #ff8a7a;
      border: 1px solid rgba(224, 60, 40, 0.35);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 800;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      color: var(--gold);
    }

    .wa-btn {
      display: block;
      width: 100%;
      margin-top: 14px;
      background: var(--whatsapp);
      color: #091e12;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    .empty-msg {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="badge">SERVICIO A DOMICILIO • WHATSAPP 9624037244</div>
    <h1>Pizzería La Romana</h1>
    <p class="subtitle">Elige tu pizza, tamaño y orilla de queso (+$50) para pedir directo</p>
  </header>

  <main class="container">
    <h2 class="section-title">Menú</h2>
    <div id="menu-list"></div>

    <h2 class="section-title">Especiales</h2>
    <div id="specials-list"></div>

    <h2 class="section-title">Datos de Entrega</h2>
    <div class="form-box">
      <label for="customer-name">Tu nombre</label>
      <input type="text" id="customer-name" placeholder="Ej. Carlos Pérez" />

      <label for="zone-select">Zona o fraccionamiento</label>
      <select id="zone-select">
        <option value="">Selecciona tu zona...</option>
        <option value="Sadasi">Sadasi</option>
        <option value="Fuentes Ara">Fuentes Ara</option>
        <option value="Xanthe">Xanthe</option>
        <option value="Ciudad Natura 1 y 2">Ciudad Natura 1 y 2</option>
        <option value="Acordia">Acordia</option>
        <option value="El Pedregal">El Pedregal</option>
      </select>

      <label for="address-input">Calle, número y referencias</label>
      <input type="text" id="address-input" placeholder="Ej. Calle Principal #12, casa con reja" />

      <label for="payment-select">Método de pago</label>
      <select id="payment-select">
        <option value="">Selecciona cómo deseas pagar...</option>
        <option value="Efectivo">Efectivo</option>
        <option value="Transferencia">Transferencia</option>
        <option value="Tarjeta">Tarjeta</option>
      </select>

      <label for="notes-input">Notas adicionales (opcional)</label>
      <textarea id="notes-input" rows="2" placeholder="Ej. Pago con billete de $500, sin picante..."></textarea>
    </div>

    <h2 class="section-title">Tu Pedido</h2>
    <div class="cart-box">
      <div id="cart-items">
        <p class="empty-msg">Aún no has agregado pizzas a tu pedido.</p>
      </div>
      <div class="total-row">
        <span>Total estimado:</span>
        <span id="cart-total">$0</span>
      </div>
      <button type="button" class="wa-btn" onclick="sendWhatsAppOrder()">Enviar pedido por WhatsApp</button>
    </div>
  </main>

  <script>
    const WHATSAPP_NUMBER = "529624037244";
    const CHEESE_CRUST_EXTRA = 50;

    const BASE_PRICES = {
      Chica: 85,
      Mediana: 135,
      Grande: 165,
      Familiar: 195,
      Jumbo: 240
    };

    const MENU_PIZZAS = [
      {
        id: "hawaiana",
        name: "Hawaiana",
        desc: "Queso mozzarella, jamón, tocineta, piña."
      },
      {
        id: "pepperoni-salami",
        name: "Pepperoni, Salami",
        desc: "Queso mozzarella, pepperoni o salami."
      },
      {
        id: "carnes-frias",
        name: "Carnes Frías",
        desc: "Queso mozzarella, bistec, salchicha, jamón y tocino."
      },
      {
        id: "champeroni",
        name: "Champeroni",
        desc: "Queso mozzarella, pepperoni y champiñones."
      },
      {
        id: "ranchera",
        name: "Ranchera",
        desc: "Queso mozzarella, chorizo, frijol, rajas."
      },
      {
        id: "vegetariana",
        name: "Vegetariana",
        desc: "Queso mozzarella, cebolla, champiñones, pimentón, pollo, elote, tocino."
      },
      {
        id: "jamon-champinon",
        name: "Jamón, Champiñón",
        desc: "Queso mozzarella, jamón y champiñones."
      }
    ];

    const SPECIAL_PIZZAS = [
      {
        id: "atun",
        name: "Atún",
        desc: "Queso mozzarella, atún, queso crema, parmesano."
      },
      {
        id: "quesos",
        name: "Quesos",
        desc: "Queso mozzarella, queso parmesano y queso crema."
      },
      {
        id: "mexicana",
        name: "Mexicana",
        desc: "Jamón, queso mozzarella, chorizo, rajas, cebolla y aguacate."
      },
      {
        id: "pastor",
        name: "Pastor",
        desc: "Queso mozzarella, carne al pastor, piña."
      },
      {
        id: "carbonara",
        name: "Carbonara",
        desc: "Tocino, carne molida, parmesano, cebolla y queso mozzarella."
      },
      {
        id: "arrachera",
        name: "Arrachera",
        desc: "Queso mozzarella, carne de arrachera, tocino, chistorra."
      }
    ];

    const ALL_PIZZAS = [...MENU_PIZZAS, ...SPECIAL_PIZZAS];
    const selectedSizes = {};
    const selectedCheeseCrust = {};
    const cart = [];

    function getItemPrice(size, withCheeseCrust) {
      return BASE_PRICES[size] + (withCheeseCrust ? CHEESE_CRUST_EXTRA : 0);
    }

    function renderSection(items, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      items.forEach((pizza) => {
        if (!selectedSizes[pizza.id]) {
          selectedSizes[pizza.id] = "Mediana";
        }
        if (!selectedCheeseCrust[pizza.id]) {
          selectedCheeseCrust[pizza.id] = false;
        }

        const currentSize = selectedSizes[pizza.id];
        const withCheeseCrust = selectedCheeseCrust[pizza.id];
        const finalPrice = getItemPrice(currentSize, withCheeseCrust);

        const card = document.createElement("div");
        card.className = "pizza-card";

        const sizesHtml = Object.entries(BASE_PRICES)
          .map(
            ([size, price]) => `
            <button
              type="button"
              class="size-btn ${size === currentSize ? "active" : ""}"
              onclick="selectSize('${pizza.id}', '${size}')"
            >
              <strong>${size}</strong>
              $${price}
            </button>
          `
          )
          .join("");

        card.innerHTML = `
          <div class="pizza-name">${pizza.name}</div>
          <div class="pizza-desc">${pizza.desc}</div>
          <div class="sizes">${sizesHtml}</div>
          <label class="crust-toggle">
            <input
              type="checkbox"
              ${withCheeseCrust ? "checked" : ""}
              onchange="toggleCheeseCrust('${pizza.id}', this.checked)"
            />
            <span>Orilla de queso (+$${CHEESE_CRUST_EXTRA})</span>
          </label>
          <button type="button" class="add-btn" onclick="addToCart('${pizza.id}')">
            Agregar ${currentSize}${withCheeseCrust ? " + Orilla de queso" : ""} — $${finalPrice}
          </button>
        `;

        container.appendChild(card);
      });
    }

    function renderAllMenus() {
      renderSection(MENU_PIZZAS, "menu-list");
      renderSection(SPECIAL_PIZZAS, "specials-list");
    }

    function selectSize(pizzaId, size) {
      selectedSizes[pizzaId] = size;
      renderAllMenus();
    }

    function toggleCheeseCrust(pizzaId, checked) {
      selectedCheeseCrust[pizzaId] = checked;
      renderAllMenus();
    }

    function addToCart(pizzaId) {
      const pizza = ALL_PIZZAS.find((p) => p.id === pizzaId);
      const size = selectedSizes[pizzaId] || "Mediana";
      const withCheeseCrust = Boolean(selectedCheeseCrust[pizzaId]);
      const price = getItemPrice(size, withCheeseCrust);

      const existing = cart.find(
        (item) =>
          item.id === pizzaId &&
          item.size === size &&
          item.withCheeseCrust === withCheeseCrust
      );

      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          id: pizza.id,
          name: pizza.name,
          size,
          withCheeseCrust,
          price,
          qty: 1
        });
      }

      renderCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function renderCart() {
      const cartContainer = document.getElementById("cart-items");
      const totalEl = document.getElementById("cart-total");

      if (cart.length === 0) {
        cartContainer.innerHTML = `<p class="empty-msg">Aún no has agregado pizzas a tu pedido.</p>`;
        totalEl.textContent = "$0";
        return;
      }

      let total = 0;
      cartContainer.innerHTML = cart
        .map((item, idx) => {
          const subtotal = item.price * item.qty;
          total += subtotal;
          const crustLabel = item.withCheeseCrust ? " + Orilla de queso" : "";
          return `
            <div class="cart-item">
              <div>
                <strong>${item.qty}x ${item.name}</strong> (${item.size}${crustLabel})<br />
                <span style="color: var(--muted); font-size: 13px;">$${subtotal}</span>
              </div>
              <button type="button" class="remove-btn" onclick="removeFromCart(${idx})">Quitar</button>
            </div>
          `;
        })
        .join("");

      totalEl.textContent = `$${total}`;
    }

    function sendWhatsAppOrder() {
      if (cart.length === 0) {
        alert("Agrega al menos una pizza antes de enviar tu pedido.");
        return;
      }

      const name = document.getElementById("customer-name").value.trim();
      const zone = document.getElementById("zone-select").value;
      const address = document.getElementById("address-input").value.trim();
      const payment = document.getElementById("payment-select").value;
      const notes = document.getElementById("notes-input").value.trim();

      if (!zone) {
        alert("Por favor selecciona tu zona de entrega.");
        return;
      }

      if (!payment) {
        alert("Por favor selecciona tu método de pago.");
        return;
      }

      let total = 0;
      const lines = cart.map((item) => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        const crustLabel = item.withCheeseCrust ? " + Orilla de queso" : "";
        return `• ${item.qty}x ${item.name} (${item.size}${crustLabel}) - $${subtotal}`;
      });

      let message = `🍕 *Nuevo Pedido — Pizzería La Romana*\n\n`;
      message += `*Detalle:*\n${lines.join("\n")}\n\n`;
      message += `*Total estimado:* $${total}\n`;
      message += `*Método de pago:* ${payment}\n`;
      if (name) message += `*Cliente:* ${name}\n`;
      message += `*Zona:* ${zone}\n`;
      if (address) message += `*Dirección:* ${address}\n`;
      if (notes) message += `*Notas:* ${notes}\n`;

      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank");
    }

    renderAllMenus();
    renderCart();
  </script>
</body>
</html>
